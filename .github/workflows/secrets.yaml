# A fast, blocking secret gate on pull requests. Conventions it follows: pinned tool
# version, least-privilege permissions, and no untrusted input interpolated into a
# shell.
#
# Deliberately scoped to the commits the PR *adds*, not the whole repo. A gate that
# re-reports the same pre-existing findings on every unrelated PR is one that gets
# `continue-on-error: true` bolted onto it within a fortnight. History is a separate
# concern — see the full-history one-liner in .gitleaks.toml.
name: secrets

on:
  pull_request:

# Read-only. The gate reports through the job log, the step summary and an
# artifact; it never needs to write to the repo or post a comment.
permissions:
  contents: read

# A force-push mid-review should cancel the in-flight scan, not queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Pin the scanner. An unpinned :latest turns an upstream rule change into a
  # surprise red build on an unrelated PR, which is how gates lose trust.
  GITLEAKS_VERSION: v8.30.1

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out with enough history to reach the base commit
        uses: actions/checkout@v4
        with:
          # The scan walks base..head, so both ends must exist locally. The default
          # shallow clone leaves the base commit unreachable, and the range then
          # silently resolves to nothing — a green gate that scanned zero commits.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Scan the commits this PR adds
        env:
          # Passed as env rather than interpolated into the script below: ${{ }} is
          # substituted before the shell ever sees it, so anything attacker-shaped in
          # a PR field would execute. These two are SHAs, but the habit is the point.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Fail loudly rather than scanning an empty range. This is the failure mode
          # that makes a secret gate worse than no gate: it stays green regardless.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Base commit ${BASE_SHA} is not present locally. The scan" \
                 "range would be empty, so the gate is not actually checking anything."
            exit 1
          fi

          COUNT=$(git rev-list --no-merges --count "${BASE_SHA}..${HEAD_SHA}")
          echo "Scanning ${COUNT} commit(s): ${BASE_SHA:0:8}..${HEAD_SHA:0:8}"
          if [ "${COUNT}" -eq 0 ]; then
            echo "::warning::No non-merge commits in range; nothing to scan."
          fi

          # --user: the container would otherwise run as root against a workspace
          #   owned by the runner user, and git refuses to operate on a repo it
          #   considers dubiously owned. It also keeps the report file writable.
          # safe.directory: belt and braces for the same ownership check.
          # --redact: findings go to a public-ish job log and an artifact any repo
          #   collaborator can download. File, line and rule are enough to act on;
          #   the secret value itself must not be copied anywhere new.
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            "zricethezav/gitleaks:${GITLEAKS_VERSION}" \
            git \
              --config /repo/.gitleaks.toml \
              --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}" \
              --report-format json \
              --report-path /repo/gitleaks-report.json \
              --redact \
              --verbose
          STATUS=$?
          set -e

          {
            echo "## gitleaks"
            echo
            echo "Scanned \`${COUNT}\` commit(s) added by this PR."
            echo
            if [ "${STATUS}" -eq 0 ]; then
              echo "No secrets found."
            else
              echo "**Potential secrets found.** Values are redacted here on purpose —"
              echo "open the file and line locally to see what matched."
              echo
              echo "| File | Line | Rule |"
              echo "|---|---|---|"
              jq -r '.[] | "| `\(.File)` | \(.StartLine) | `\(.RuleID)` |"' \
                gitleaks-report.json
              echo
              echo "If this is a real secret: rotate it first, then remove it from the"
              echo "branch. Rewriting the commit does not un-leak a value that has been"
              echo "pushed. If it is a lab value that only works against a local cluster,"
              echo "add a scoped entry to \`.gitleaks.toml\` explaining why."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${STATUS}"

      - name: Upload the redacted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7
