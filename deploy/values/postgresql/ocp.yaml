# OpenShift (CRC, SNO or a full cluster). The chart default `local-path` is the k3s
# and Kind provisioner and does not exist here; a PVC asking for it stays Pending
# and the CNPG Cluster never leaves "Setting up primary".
#
# An empty storageClass makes the chart omit the field, so the PVC gets the
# cluster's default StorageClass instead:
#   CRC  -> crc-csi-hostpath-provisioner
#   SNO  -> whatever LVM Storage or ODF registered as default
# Check with `oc get storageclass` and look for "(default)". Set a name here only
# when the cluster has no default or you want a specific class.
#
# Nothing else differs from the other profiles. CNPG leaves the pod security
# context unset under SCC, so the pods inherit restricted-v2 and run as an
# arbitrary UID without any change to the chart. No LoadBalancer either: reach the
# database with `oc -n databases port-forward svc/postgresql-rw 5432:5432`.
#
# The superuser password is generated by CNPG into the `postgresql-superuser`
# Secret and is deliberately absent from this repo.
storage:
  storageClass: ""
