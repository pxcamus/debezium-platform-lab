# k3s on a public address. The chart defaults are the safe ones and are kept:
#
#   service.loadBalancer.enabled: false — ServiceLB would otherwise bind 5432 onto
#   the node's public IP, in front of the fixed lab role passwords the chart sets
#   for app_owner/debezium/apicurio. Use a port-forward for ad-hoc access:
#     kubectl -n databases port-forward svc/postgresql-rw 5432:5432
#
# The superuser password is generated by CNPG into the `postgresql-superuser`
# Secret and is deliberately absent from this repo.
storage:
  storageClass: local-path
