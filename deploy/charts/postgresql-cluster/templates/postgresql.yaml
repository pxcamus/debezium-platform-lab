apiVersion: v1
kind: Secret
metadata:
  name: postgresql-app-owner
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgresql-cluster
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: kubernetes.io/basic-auth
stringData:
  username: "app_owner"
  password: "app_owner"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-debezium
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgresql-cluster
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: kubernetes.io/basic-auth
stringData:
  username: "debezium"
  password: "debezium"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-apicurio
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgresql-cluster
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: kubernetes.io/basic-auth
stringData:
  username: "apicurio"
  password: "apicurio"
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgresql-cluster
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16

  # No superuserSecret: with enableSuperuserAccess on and no secret named, CNPG
  # generates a random password and owns the `postgresql-superuser` Secret itself
  # (`<cluster>-superuser`), so no superuser credential is ever written to git.
  # Read it back with:
  #   kubectl -n databases get secret postgresql-superuser \
  #     -o jsonpath='{.data.password}' | base64 -d
  # Naming a secret here again would pin the password into a template; that is what
  # this deliberately avoids. The app/debezium/apicurio roles below keep their fixed
  # lab credentials on purpose — other releases (kafka-connect, apicurio) reference
  # them by value.
  enableSuperuserAccess: true

  bootstrap:
    initdb:
      database: ecommerce
      owner: app_owner
      secret:
        name: postgresql-app-owner

  postgresql:
    parameters:
      wal_level: logical
      max_replication_slots: "4"
      max_wal_senders: "4"

  managed:
    roles:
      - name: debezium
        ensure: present
        login: true
        replication: true
        passwordSecret:
          name: postgresql-debezium
        comment: "Debezium CDC user"
      - name: apicurio
        ensure: present
        login: true
        passwordSecret:
          name: postgresql-apicurio
        comment: "Apicurio Registry user"

  storage:
    size: 10Gi
    storageClass: {{ .Values.storage.storageClass | default "local-path" }}

  monitoring:
    enablePodMonitor: false
{{- if .Values.service.loadBalancer.enabled }}
---
# Off by default. On k3s, ServiceLB binds this straight onto the node's address, so
# on a public lab box an enabled LoadBalancer publishes 5432 to the internet in front
# of the fixed lab role passwords above. Reach the cluster with
# `kubectl -n databases port-forward svc/postgresql-rw 5432:5432` instead, or enable
# this together with service.loadBalancer.sourceRanges.
apiVersion: v1
kind: Service
metadata:
  name: postgresql-lb
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgresql-cluster
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: LoadBalancer
{{- with .Values.service.loadBalancer.sourceRanges }}
  loadBalancerSourceRanges:
{{ toYaml . | indent 4 }}
{{- end }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    cnpg.io/cluster: postgresql
    cnpg.io/instanceRole: primary
{{- end }}
